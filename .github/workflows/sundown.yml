# Example: weekly Sundown on this repo. Copy or call the composite action from your project.
name: Sundown weekly

on:
  schedule:
    # Monday 11:00 NZDT (UTC+13) ≈ Sunday 22:00 UTC
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sundown
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}